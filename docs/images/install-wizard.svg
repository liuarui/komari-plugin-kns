<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">KNS 安装向导示意图</title><desc id="desc">选择机器、协议和监听端口，并核对公网端口映射。</desc>
  <rect width="1200" height="690" rx="20" fill="#f4f7fc"/><rect width="205" height="690" rx="20" fill="#fff"/><path d="M205 0v690" stroke="#e3e9f2"/><rect x="24" y="24" width="42" height="42" rx="13" fill="#4264e9"/><text x="45" y="52" text-anchor="middle" fill="#fff" font-size="22" font-family="sans-serif" font-weight="700">K</text><text x="78" y="43" fill="#202b3c" font-size="18" font-family="sans-serif" font-weight="700">KNS</text><text x="78" y="61" fill="#8290a5" font-size="12" font-family="sans-serif">节点工作台</text><text x="48" y="171" fill="#546278" font-size="14" font-family="sans-serif">▦　工作台</text><rect x="14" y="190" width="176" height="46" rx="12" fill="#edf2ff"/><text x="48" y="219" fill="#4264e9" font-size="14" font-family="sans-serif" font-weight="700">▤　机器与节点</text><text x="48" y="270" fill="#546278" font-size="14" font-family="sans-serif">↗　订阅</text>
  <text x="242" y="42" fill="#546278" font-size="12" font-family="sans-serif">KNS　/　机器与节点　/　安装节点</text><text x="242" y="95" fill="#202b3c" font-size="27" font-family="sans-serif" font-weight="700">安装节点</text><text x="242" y="122" fill="#8290a5" font-size="14" font-family="sans-serif">每一步只显示完成操作所需的信息</text>
  <rect x="242" y="148" width="915" height="66" rx="14" fill="#fff" stroke="#e3e9f2"/><rect x="264" y="163" width="245" height="36" rx="18" fill="#edf2ff"/><text x="386" y="186" text-anchor="middle" fill="#4264e9" font-size="13" font-family="sans-serif" font-weight="700">1　选择机器</text><rect x="525" y="163" width="245" height="36" rx="18" fill="#edf2ff"/><text x="647" y="186" text-anchor="middle" fill="#4264e9" font-size="13" font-family="sans-serif" font-weight="700">2　选择协议</text><rect x="786" y="163" width="245" height="36" rx="18" fill="#f4f7fc"/><text x="908" y="186" text-anchor="middle" fill="#8290a5" font-size="13" font-family="sans-serif">3　确认安装</text>
  <text x="242" y="252" fill="#202b3c" font-size="17" font-family="sans-serif" font-weight="700">选择协议与监听端口</text><text x="242" y="275" fill="#8290a5" font-size="12" font-family="sans-serif">端口会按目标机器已有节点自动避开冲突；提交前仍会逐台检查。</text>
  <g font-family="sans-serif"><rect x="242" y="295" width="440" height="108" rx="14" fill="#edf2ff" stroke="#4264e9" stroke-width="2"/><circle cx="266" cy="321" r="9" fill="#4264e9"/><path d="m262 321 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="286" y="326" fill="#202b3c" font-size="16" font-weight="700">VLESS Reality</text><text x="263" y="351" fill="#8290a5" font-size="12">TCP · 使用推荐默认值</text><text x="263" y="379" fill="#546278" font-size="12">机器监听端口</text><rect x="370" y="359" width="120" height="31" rx="7" fill="#fff" stroke="#dce3ee"/><text x="385" y="380" fill="#202b3c" font-size="14" font-weight="600">443</text>
  <rect x="704" y="295" width="453" height="108" rx="14" fill="#fff" stroke="#e3e9f2"/><circle cx="729" cy="321" r="9" fill="#fff" stroke="#b8c3d2"/><text x="750" y="326" fill="#202b3c" font-size="16" font-weight="700">Hysteria2</text><text x="725" y="351" fill="#8290a5" font-size="12">UDP · TLS 名称（SNI）在高级参数中填写</text><text x="725" y="379" fill="#546278" font-size="12">机器监听端口</text><rect x="833" y="359" width="120" height="31" rx="7" fill="#fff" stroke="#dce3ee"/><text x="848" y="380" fill="#202b3c" font-size="14">443</text>
  <rect x="242" y="420" width="440" height="113" rx="14" fill="#fff" stroke="#e3e9f2"/><circle cx="266" cy="446" r="9" fill="#fff" stroke="#b8c3d2"/><text x="286" y="451" fill="#202b3c" font-size="16" font-weight="700">Shadowsocks</text><text x="263" y="476" fill="#8290a5" font-size="12">TCP + UDP · 使用推荐默认值</text><text x="263" y="507" fill="#546278" font-size="12">机器监听端口</text><rect x="370" y="487" width="120" height="31" rx="7" fill="#fff" stroke="#dce3ee"/><text x="385" y="508" fill="#202b3c" font-size="14">8443</text>
  <rect x="704" y="420" width="453" height="113" rx="14" fill="#fff" stroke="#e3e9f2"/><text x="725" y="451" fill="#202b3c" font-size="16" font-weight="700">连接入口</text><rect x="725" y="465" width="410" height="37" rx="8" fill="#fff" stroke="#dce3ee"/><text x="741" y="489" fill="#546278" font-size="13">公网地址 / NAT 转发　⌄</text><text x="725" y="521" fill="#8290a5" font-size="11">路由器或云网络还需配置端口转发</text></g>
  <rect x="242" y="552" width="915" height="74" rx="13" fill="#fff5e2" stroke="#eedcb7"/><text x="264" y="580" fill="#966a1f" font-size="13" font-family="sans-serif" font-weight="700">映射预览</text><text x="264" y="604" fill="#6f5a34" font-size="13" font-family="sans-serif">公网地址:外部端口 / TCP　→　机器地址:443 / TCP</text><rect x="1007" y="644" width="150" height="36" rx="10" fill="#4264e9"/><text x="1082" y="667" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif" font-weight="700">下一步</text>
</svg>
