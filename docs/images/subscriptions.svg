<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">KNS 订阅选择示意图</title><desc id="desc">设置机器和协议筛选，查看时选择客户端以及 Clash 规则模板。</desc>
  <rect width="1200" height="650" rx="20" fill="#f4f7fc"/><rect x="35" y="32" width="1130" height="586" rx="18" fill="#fff" stroke="#e3e9f2"/><text x="68" y="81" fill="#202b3c" font-size="25" font-family="sans-serif" font-weight="700">订阅档案</text><text x="68" y="109" fill="#8290a5" font-size="14" font-family="sans-serif">为不同客户端选择格式、机器和节点范围</text>
  <text x="68" y="155" fill="#546278" font-size="13" font-family="sans-serif" font-weight="700">档案名称</text><rect x="68" y="168" width="310" height="42" rx="9" fill="#fff" stroke="#dce3ee"/><text x="84" y="194" fill="#202b3c" font-size="14" font-family="sans-serif">日常设备</text><text x="411" y="155" fill="#546278" font-size="13" font-family="sans-serif" font-weight="700">包含机器</text><rect x="411" y="168" width="310" height="42" rx="9" fill="#fff" stroke="#4264e9" stroke-width="2"/><rect x="424" y="178" width="91" height="22" rx="11" fill="#edf2ff"/><text x="469" y="193" text-anchor="middle" fill="#4264e9" font-size="11" font-family="sans-serif">东京 · 节点 A ×</text><text x="535" y="194" fill="#8290a5" font-size="13" font-family="sans-serif">筛选机器…</text><text x="754" y="155" fill="#546278" font-size="13" font-family="sans-serif" font-weight="700">协议</text><rect x="754" y="168" width="377" height="42" rx="9" fill="#fff" stroke="#dce3ee"/><rect x="768" y="178" width="128" height="22" rx="11" fill="#edf2ff"/><text x="832" y="193" text-anchor="middle" fill="#4264e9" font-size="11" font-family="sans-serif">VLESS Reality ×</text><text x="910" y="194" fill="#8290a5" font-size="13" font-family="sans-serif">选择协议…</text>
  <rect x="68" y="232" width="1063" height="1" fill="#e3e9f2"/><text x="68" y="272" fill="#202b3c" font-size="18" font-family="sans-serif" font-weight="700">查看订阅链接</text><text x="68" y="298" fill="#8290a5" font-size="13" font-family="sans-serif">选择客户端，复制链接或扫码导入</text>
  <text x="68" y="342" fill="#546278" font-size="13" font-family="sans-serif" font-weight="700">订阅格式 / 客户端</text><rect x="68" y="356" width="530" height="48" rx="10" fill="#fff" stroke="#4264e9" stroke-width="2"/><text x="86" y="386" fill="#202b3c" font-size="14" font-family="sans-serif">Clash · ACL4SSR 轻量规则</text><path d="m567 376 8 8 8-8" fill="none" stroke="#546278" stroke-width="2"/>
  <rect x="68" y="414" width="530" height="108" rx="12" fill="#fff" stroke="#dce3ee"/><rect x="68" y="414" width="530" height="36" rx="12" fill="#f4f7fc"/><text x="88" y="438" fill="#546278" font-size="13" font-family="sans-serif">可选客户端与规则模板</text><text x="88" y="475" fill="#202b3c" font-size="13" font-family="sans-serif">URI　·　Mihomo　·　sing-box　·　Clash　·　Stash　·　Surge</text><text x="88" y="502" fill="#4264e9" font-size="13" font-family="sans-serif" font-weight="700">Clash：默认规则　/　ACL4SSR 轻量　/　ACL4SSR 完整</text>
  <rect x="635" y="356" width="496" height="166" rx="12" fill="#f4f7fc"/><text x="660" y="390" fill="#202b3c" font-size="15" font-family="sans-serif" font-weight="700">链接安全</text><text x="660" y="421" fill="#546278" font-size="13" font-family="sans-serif">令牌可关闭、开启或轮换，每个档案仅有一个有效令牌。</text><text x="660" y="447" fill="#546278" font-size="13" font-family="sans-serif">无需令牌的链接可公开访问，请只分享给预期用户。</text><text x="660" y="483" fill="#966a1f" font-size="12" font-family="sans-serif">外部转换器会收到源订阅 URI 与节点凭据。</text>
  <rect x="68" y="548" width="156" height="42" rx="10" fill="#4264e9"/><text x="146" y="575" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif" font-weight="700">复制订阅链接</text><rect x="237" y="548" width="110" height="42" rx="10" fill="#fff" stroke="#dce3ee"/><text x="292" y="575" text-anchor="middle" fill="#546278" font-size="13" font-family="sans-serif">显示二维码</text><text x="375" y="575" fill="#8290a5" font-size="12" font-family="sans-serif">关闭链接窗口后，页面清除本次显示内容。</text>
</svg>
