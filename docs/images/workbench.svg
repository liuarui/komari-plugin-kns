<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">KNS 机器工作台示意图</title><desc id="desc">按 Komari 顺序显示机器卡片，可搜索、筛选和切换布局。</desc>
  <rect width="1200" height="690" rx="20" fill="#f4f7fc"/><rect x="0" y="0" width="205" height="690" rx="20" fill="#fff"/><path d="M205 0v690" stroke="#e3e9f2"/>
  <rect x="24" y="24" width="42" height="42" rx="13" fill="#4264e9"/><text x="45" y="52" text-anchor="middle" fill="#fff" font-size="22" font-family="sans-serif" font-weight="700">K</text><text x="78" y="43" fill="#202b3c" font-size="18" font-family="sans-serif" font-weight="700">KNS</text><text x="78" y="61" fill="#8290a5" font-size="12" font-family="sans-serif">节点工作台</text>
  <text x="32" y="121" fill="#8290a5" font-size="12" font-family="sans-serif">工作台</text><rect x="14" y="142" width="176" height="46" rx="12" fill="#edf2ff"/><text x="48" y="171" fill="#4264e9" font-size="15" font-family="sans-serif" font-weight="700">▦　工作台</text><text x="48" y="222" fill="#546278" font-size="14" font-family="sans-serif">▤　机器与节点</text><text x="48" y="270" fill="#546278" font-size="14" font-family="sans-serif">↗　订阅</text><text x="48" y="318" fill="#546278" font-size="14" font-family="sans-serif">▣　操作记录</text>
  <text x="242" y="42" fill="#546278" font-size="12" font-family="sans-serif">KNS　/　机器与节点</text><text x="242" y="96" fill="#202b3c" font-size="28" font-family="sans-serif" font-weight="700">机器与节点</text><text x="242" y="123" fill="#8290a5" font-size="14" font-family="sans-serif">顺着 Komari 服务器列表查看和管理 OneBox 节点</text>
  <rect x="242" y="148" width="915" height="68" rx="14" fill="#fff" stroke="#e3e9f2"/><rect x="262" y="164" width="225" height="38" rx="9" fill="#fff" stroke="#dce3ee"/><text x="276" y="188" fill="#8290a5" font-size="13" font-family="sans-serif">查找机器名称或地址</text><rect x="501" y="164" width="148" height="38" rx="9" fill="#fff" stroke="#dce3ee"/><text x="516" y="188" fill="#546278" font-size="13" font-family="sans-serif">在线状态　全部⌄</text><rect x="663" y="164" width="166" height="38" rx="9" fill="#fff" stroke="#dce3ee"/><text x="678" y="188" fill="#546278" font-size="13" font-family="sans-serif">OneBox　全部⌄</text><rect x="843" y="164" width="148" height="38" rx="9" fill="#fff" stroke="#dce3ee"/><text x="858" y="188" fill="#546278" font-size="13" font-family="sans-serif">协议　全部⌄</text><rect x="1003" y="164" width="132" height="38" rx="9" fill="#edf2ff"/><text x="1069" y="188" text-anchor="middle" fill="#4264e9" font-size="13" font-family="sans-serif" font-weight="700">三列卡片</text>
  <text x="242" y="241" fill="#8290a5" font-size="12" font-family="sans-serif">显示 28 台机器 · 顺序与 Komari 服务器列表一致</text>
  <g font-family="sans-serif"><rect x="242" y="260" width="292" height="184" rx="15" fill="#fff" stroke="#e3e9f2"/><text x="263" y="291" fill="#202b3c" font-size="17" font-weight="700">东京 · 节点 A</text><rect x="432" y="274" width="78" height="25" rx="13" fill="#eaf7ef"/><text x="471" y="291" text-anchor="middle" fill="#128665" font-size="11">在线</text><text x="263" y="319" fill="#8290a5" font-size="12">Debian GNU/Linux · amd64</text><text x="263" y="347" fill="#546278" font-size="13">IPv4　203.0.113.10</text><rect x="261" y="365" width="253" height="48" rx="10" fill="#f4f7fc"/><text x="276" y="386" fill="#202b3c" font-size="13" font-weight="600">VLESS Reality · 443/TCP</text><text x="276" y="403" fill="#8290a5" font-size="11">运行正常　·　允许发布</text>
  <rect x="553" y="260" width="292" height="184" rx="15" fill="#fff" stroke="#e3e9f2"/><text x="574" y="291" fill="#202b3c" font-size="17" font-weight="700">法兰克福 · 节点 B</text><rect x="744" y="274" width="78" height="25" rx="13" fill="#eaf7ef"/><text x="783" y="291" text-anchor="middle" fill="#128665" font-size="11">在线</text><text x="574" y="319" fill="#8290a5" font-size="12">Ubuntu · amd64</text><text x="574" y="347" fill="#546278" font-size="13">IPv4　198.51.100.24</text><rect x="572" y="365" width="253" height="48" rx="10" fill="#f4f7fc"/><text x="587" y="386" fill="#202b3c" font-size="13" font-weight="600">Hysteria2 · 8443/UDP</text><text x="587" y="403" fill="#8290a5" font-size="11">未核查　·　按订阅档案筛选</text>
  <rect x="864" y="260" width="292" height="184" rx="15" fill="#fff" stroke="#e3e9f2"/><text x="885" y="291" fill="#202b3c" font-size="17" font-weight="700">新加坡 · 节点 C</text><rect x="1055" y="274" width="78" height="25" rx="13" fill="#fff5e2"/><text x="1094" y="291" text-anchor="middle" fill="#966a1f" font-size="11">离线</text><text x="885" y="319" fill="#8290a5" font-size="12">Alpine Linux · arm64</text><text x="885" y="347" fill="#546278" font-size="13">最近同步　10 分钟前</text><rect x="883" y="365" width="253" height="48" rx="10" fill="#f4f7fc"/><text x="898" y="386" fill="#202b3c" font-size="13" font-weight="600">扫描已有节点</text><text x="898" y="403" fill="#8290a5" font-size="11">只读操作　·　不会修改配置</text></g>
  <rect x="242" y="470" width="915" height="150" rx="15" fill="#fff" stroke="#e3e9f2"/><text x="266" y="505" fill="#202b3c" font-size="16" font-family="sans-serif" font-weight="700">机器操作</text><rect x="266" y="526" width="135" height="40" rx="10" fill="#4264e9"/><text x="333" y="551" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif" font-weight="700">安装节点</text><rect x="412" y="526" width="164" height="40" rx="10" fill="#fff" stroke="#dce3ee"/><text x="494" y="551" text-anchor="middle" fill="#546278" font-size="13" font-family="sans-serif">扫描已有节点</text><rect x="588" y="526" width="152" height="40" rx="10" fill="#fff" stroke="#dce3ee"/><text x="664" y="551" text-anchor="middle" fill="#546278" font-size="13" font-family="sans-serif">机器设置</text><text x="266" y="592" fill="#8290a5" font-size="12" font-family="sans-serif">可切换三列卡片、单列卡片或紧凑列表；不纳管与已删除机器可随时筛出查看。</text>
</svg>
