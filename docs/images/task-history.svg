<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">KNS 操作记录示意图</title><desc id="desc">操作记录显示任务目标、状态和核验结果。</desc>
  <rect width="1200" height="500" rx="20" fill="#f4f7fc"/><rect x="34" y="32" width="1132" height="436" rx="18" fill="#fff" stroke="#e3e9f2"/><text x="68" y="82" fill="#202b3c" font-size="25" font-family="sans-serif" font-weight="700">操作记录</text><text x="68" y="111" fill="#8290a5" font-size="14" font-family="sans-serif">查看远程任务提交、执行和核验结果；结果不确定时先核查机器状态。</text>
  <rect x="68" y="143" width="1064" height="48" rx="9" fill="#f4f7fc"/><text x="88" y="173" fill="#546278" font-size="13" font-family="sans-serif" font-weight="700">时间 / Job ID</text><text x="355" y="173" fill="#546278" font-size="13" font-family="sans-serif" font-weight="700">目标 / 动作</text><text x="700" y="173" fill="#546278" font-size="13" font-family="sans-serif" font-weight="700">状态</text><text x="850" y="173" fill="#546278" font-size="13" font-family="sans-serif" font-weight="700">结果</text>
  <path d="M68 248h1064M68 305h1064M68 362h1064" stroke="#e3e9f2"/><text x="88" y="224" fill="#546278" font-size="13" font-family="sans-serif">2026-11-09 08:33 · job-a12b</text><text x="355" y="224" fill="#202b3c" font-size="13" font-family="sans-serif">东京 · 节点 A · 安装</text><rect x="690" y="205" width="92" height="27" rx="13" fill="#eaf7ef"/><text x="736" y="223" text-anchor="middle" fill="#128665" font-size="12" font-family="sans-serif" font-weight="700">成功</text><text x="850" y="224" fill="#546278" font-size="13" font-family="sans-serif">OneBox 与远端状态已核验</text>
  <text x="88" y="281" fill="#546278" font-size="13" font-family="sans-serif">2026-11-09 08:17 · job-b34c</text><text x="355" y="281" fill="#202b3c" font-size="13" font-family="sans-serif">新加坡 · 节点 B · 重配置</text><rect x="690" y="262" width="92" height="27" rx="13" fill="#fff5e2"/><text x="736" y="280" text-anchor="middle" fill="#966a1f" font-size="12" font-family="sans-serif" font-weight="700">核查中</text><text x="850" y="281" fill="#546278" font-size="13" font-family="sans-serif">等待 Agent 与 OneBox 回调</text>
  <text x="88" y="338" fill="#546278" font-size="13" font-family="sans-serif">2026-11-09 07:58 · job-c56d</text><text x="355" y="338" fill="#202b3c" font-size="13" font-family="sans-serif">法兰克福 · 节点 C · 接管</text><rect x="690" y="319" width="92" height="27" rx="13" fill="#fff0ef"/><text x="736" y="337" text-anchor="middle" fill="#be494e" font-size="12" font-family="sans-serif" font-weight="700">失败</text><text x="850" y="338" fill="#546278" font-size="13" font-family="sans-serif">查看原因并先核对机器状态</text>
  <rect x="68" y="389" width="1064" height="48" rx="10" fill="#edf2ff"/><text x="88" y="418" fill="#4264e9" font-size="13" font-family="sans-serif">已提交只表示 Komari 接收请求；只有经过远端核验后任务才会标记成功。</text>
</svg>
